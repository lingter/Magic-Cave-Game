<style>
:root{font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#233550;background:#f4f7fc;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #d7e1ef;border-radius:8px;background:#fff;color:#344b6d;padding:9px 13px}button:hover{background:#e9f0fc}button.active{background:#1c365c;color:white;border-color:#1c365c}button:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid #0e9eac;outline-offset:2px}header{padding:16px 24px;background:#fff;border-bottom:1px solid #dce5f2;display:flex;align-items:center;gap:18px}header strong{font-size:19px}header small{color:#75849a}nav{display:flex;gap:8px;align-items:center;padding:12px 24px;background:white;border-bottom:1px solid #dce5f2;flex-wrap:wrap}#search{width:220px;padding:10px 12px;border:1px solid #d5deeb;border-radius:8px}.spacer{flex:1}main{display:grid;grid-template-columns:minmax(0,1fr) 375px;height:calc(100vh - 144px);min-height:450px}#stage{overflow:hidden;position:relative;touch-action:none;cursor:grab;min-width:0;background:#f4f7fc}#stage:active{cursor:grabbing}#canvas{width:100%;height:100%;display:block;user-select:none}.node{cursor:pointer;transition:opacity .15s}.node:hover>rect{stroke:#0a9ba7;stroke-width:4}.node.selected>rect{stroke:#0a9ba7;stroke-width:6}.muted{opacity:.18}.system.dim{opacity:.22}.hit>rect{stroke:#dd8d15;stroke-width:5}.node text{pointer-events:none}aside{overflow:auto;background:#fff;border-left:1px solid #dce5f2;padding:23px}aside h1{font-size:23px;margin:10px 0 8px}aside h2{font-size:14px;color:#45618a;margin:25px 0 8px;letter-spacing:.03em}aside p{line-height:1.85;margin:8px 0;color:#506580}.badge{font-size:12px;background:#e8f0fc;color:#345d9c;padding:5px 9px;border-radius:20px;display:inline-block}.unity{background:#e8f5f0;border-left:3px solid #37856a;padding:11px 13px;line-height:1.85;color:#28614f}.source{font-size:12px;line-height:1.75;overflow-wrap:anywhere;background:#f3f6fb;padding:10px;border-radius:8px;margin:8px 0}.source a{color:#3668ab}aside button.jump{display:block;width:100%;text-align:left;margin:7px 0;font-size:13px;line-height:1.6}.tiny{font-size:12px;color:#71829a;line-height:1.8}#hint{position:absolute;left:16px;bottom:16px;background:#fffE;border:1px solid #d7e1ef;border-radius:9px;padding:9px 12px;font-size:12px;color:#657a96;pointer-events:none}#searchResults{position:absolute;top:12px;left:15px;right:15px;max-height:260px;overflow:auto;background:#fff;box-shadow:0 7px 30px #1a355629;border-radius:12px;z-index:2;display:none;padding:12px}#searchResults button{margin:4px;font-size:13px}#searchResults span{display:block;color:#6e7e95;margin-bottom:6px}.pill{display:inline-block;border:1px solid #d9e4f1;border-radius:6px;padding:5px 8px;margin:3px;font-size:12px}.edge{fill:none;stroke:#9aafc9;stroke-width:2;opacity:.32}.edge.chosen{stroke:#127b85;stroke-width:3.5;opacity:.85}.edge-label{font-size:16px;fill:#215e68;paint-order:stroke;stroke:#f4f7fc;stroke-width:7;stroke-linejoin:round}.relation-node text{pointer-events:none}.relation-node{cursor:pointer}.relation-node:hover rect{stroke:#179ba8;stroke-width:4}footer{height:22px;font-size:11px;color:#7e8ba0;background:#fff;padding-left:24px;line-height:22px;border-top:1px solid #dce5f2}@media(max-width:850px){header{padding:12px 16px;flex-wrap:wrap;gap:5px}header small{width:100%}nav{padding:10px 12px}main{grid-template-columns:minmax(0,1fr);height:auto}#stage{height:68vh;min-height:420px}aside{border-left:0;border-top:1px solid #dce5f2;max-height:60vh}#search{width:160px}.spacer{display:none}footer{height:auto}header strong{font-size:16px}}@media print{header,nav,aside,#hint,#searchResults,footer{display:none}main{display:block;height:auto}#stage{height:auto}#canvas{width:100%;height:auto}}
.tech-link{pointer-events:auto!important;cursor:pointer;text-decoration:underline;fill:#146f7f}.tech-link:hover{fill:#d57817}.tech-chip{margin:4px;font-size:12px;color:#146f7f}dialog{border:1px solid #d7e1ef;border-radius:16px;padding:0;width:min(880px,94vw);max-height:86vh;color:#233550;box-shadow:0 20px 90px #152e5344}dialog::backdrop{background:#142d5266}#guideHead{display:flex;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid #dce5f2;position:sticky;top:0;background:white;z-index:1}#guideTitle{flex:1;margin:0;font-size:20px}#guideBody{padding:18px 24px;overflow-wrap:anywhere}#guideBody p{line-height:1.85;color:#506580}#guideBody h3{margin:22px 0 8px;font-size:15px}#guideBody pre{white-space:pre-wrap;background:#172c50;color:#e1edff;padding:18px;border-radius:10px;line-height:1.7}#guideBody .jump{display:block;width:100%;text-align:left;margin:8px 0}#guideBody a{color:#2864a4}#guideBody .unity{margin:12px 0}.guide-grid{display:flex;gap:5px;flex-wrap:wrap}
</style>
</head>
<body>
<header><strong>魔洞游戏 · 现有功能思维导图</strong><small>2026.11.03 / 源码核查 / 12个系统 · 48个功能 · 26条联系</small></header>
<nav aria-label="导图工具">
 <button id="mindBtn" class="active">功能思维导图</button><button id="relBtn">系统关系图</button><button id="unityBtn">Unity功能介绍</button>
 <input id="search" type="search" placeholder="搜索功能 / Unity API / 脚本" aria-label="搜索功能、Unity API或脚本">
 <span class="spacer"></span><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="fitBtn">适应画布</button><button id="boundsBtn">范围与边界</button>
</nav>
<main>
 <div id="stage"><!--MAP--><div id="hint">滚轮缩放 · 拖动画布 · 点击系统/功能看实现与Unity标注</div><div id="searchResults" role="status"></div></div>
 <aside id="details" aria-live="polite"></aside>
</main>
<footer>当前工作区实现说明；具体Unity API与自定义C#规则分别标注。HTML离线可用。本次未执行Unity编辑器操作、游戏测试或构建。</footer>
<dialog id="unityDialog" aria-labelledby="guideTitle"><div id="guideHead"><h2 id="guideTitle">Unity功能介绍</h2><button id="guideBack">全部功能</button><button id="guideClose" aria-label="关闭Unity功能介绍">关闭</button></div><div id="guideBody"></div></dialog>
<script>
'use strict';
const DATA=/*DATA*/;
const stage=document.querySelector('#stage'), svg=stage.querySelector('svg'), panel=document.querySelector('#details');
svg.id='canvas';
const original=[...svg.children].filter(e=>e.tagName!=='defs');
const NS='http://www.w3.org/2000/svg';
const mind=document.createElementNS(NS,'g'); mind.id='mind'; original.forEach(e=>mind.append(e));svg.append(mind);
const relation=document.createElementNS(NS,'g');relation.id='relations';relation.style.display='none';svg.append(relation);
const ids=new Map(), owner=new Map();
DATA.systems.forEach(s=>{ids.set(s.id,s);owner.set(s.id,s);s.features.forEach(f=>{ids.set(f.id,f);owner.set(f.id,s)})});
let mode='mind', selected=null, selectedSystem=null, vb=[0,0,2500,2200];
function E(tag,attrs={},text){const el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;return el}
function h(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
const guideDialog=document.querySelector('#unityDialog'),guideBody=document.querySelector('#guideBody');
function guidesFor(n){const text=n.features?n.features.map(f=>f.unityShort).join(' '):n.unityShort;return DATA.unityGuides.filter(g=>g.tags.some(t=>(text||'').includes(t)))}
function guideButton(g){const b=h('button',g.name,'tech-chip');b.dataset.guide=g.id;b.onclick=()=>showGuide(g.id);return b}
function guideLinks(n){const box=h('div',undefined,'guide-grid');guidesFor(n).forEach(g=>box.append(guideButton(g)));panel.append(box)}
function showGuide(id){
 guideBody.replaceChildren();const g=DATA.unityGuides.find(g=>g.id===id);
 document.querySelector('#guideTitle').textContent=g?g.name:'Unity功能介绍 · 点击查看';
 document.querySelector('#guideBack').hidden=!g;
 if(!g){guideBody.append(h('p','选择Unity功能，查看介绍、用法示例与项目实际应用。示例用于讲解，不在网页内执行。'));DATA.unityGuides.forEach(g=>guideBody.append(guideButton(g)))}
 else{
  for(const [title,body] of [['功能介绍',g.intro],['如何使用',g.usage]])guideBody.append(h('h3',title),h('p',body));
  guideBody.append(h('h3','用法示例（讲解片段）'),h('pre',g.example),h('h3','在本项目中的体现'),h('div',g.project,'unity'));
  guideBody.append(h('h3','实际代码位置'));g.sources.forEach(s=>{const box=h('div',undefined,'source'),a=h('a',s.path+':'+s.line);a.href='../../'+s.path+'#L'+s.line;a.target='_blank';box.append(a,h('div',s.symbol));guideBody.append(box)});
  guideBody.append(h('h3','涉及的现有功能（点击返回导图）'));
  DATA.systems.forEach(s=>s.features.filter(f=>guidesFor(f).some(t=>t.id===id)).forEach(f=>{const b=h('button',s.name+' → '+f.name,'jump');b.onclick=()=>{guideDialog.close();select(f.id,true)};guideBody.append(b)}));
  const a=h('a','Unity官方参考文档（联网打开）');a.href=g.url;a.target='_blank';a.rel='noopener noreferrer';guideBody.append(h('h3','继续查阅'),a,h('p','代码位置来自导图生成时的工作区源码。示例省略上下文；具体API与安装版本以项目为准。'));
 }
 if(!guideDialog.open)guideDialog.showModal();guideDialog.scrollTop=0;
}
document.querySelector('#unityBtn').onclick=()=>showGuide();document.querySelector('#guideBack').onclick=()=>showGuide();document.querySelector('#guideClose').onclick=()=>guideDialog.close();
// Make the actual Unity labels in the map individually clickable, preserving C# labels.
svg.querySelectorAll('.feature').forEach(node=>{
 const f=ids.get(node.dataset.id),text=node.querySelectorAll('text')[1];if(!f||!text)return;
 const original=text.textContent, matches=[];
 DATA.unityGuides.forEach(g=>g.tags.forEach(tag=>{let start=original.indexOf(tag);while(start>=0){matches.push({start,end:start+tag.length,g});start=original.indexOf(tag,start+tag.length)}}));
 matches.sort((a,b)=>a.start-b.start||b.end-a.end);let at=0;text.textContent='';
 for(const m of matches){if(m.start<at)continue;text.append(document.createTextNode(original.slice(at,m.start)));const span=E('tspan',{class:'tech-link','data-guide':m.g.id,tabindex:0,role:'button','aria-label':'介绍 '+m.g.name},original.slice(m.start,m.end));span.addEventListener('pointerdown',e=>e.stopPropagation());span.addEventListener('click',e=>{e.stopPropagation();showGuide(m.g.id)});span.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();showGuide(m.g.id)}});text.append(span);at=m.end}
 text.append(document.createTextNode(original.slice(at)));
});
function view(){svg.setAttribute('viewBox',vb.join(' '));document.querySelector('#zoomLabel').textContent=Math.round((mode==='mind'?2500:1800)/vb[2]*100)+'%'}
function fit(){vb=mode==='mind'?[0,0,2500,2200]:[0,0,1800,1500];view()}
function zoom(factor,point){const r=svg.getBoundingClientRect();const c=point||{x:r.left+r.width/2,y:r.top+r.height/2};const mat=svg.getScreenCTM();if(!mat)return;const p=new DOMPoint(c.x,c.y).matrixTransform(mat.inverse());const width=Math.max(450,Math.min(6000,vb[2]*factor)), k=width/vb[2];vb=[p.x+(vb[0]-p.x)*k,p.y+(vb[1]-p.y)*k,width,vb[3]*k];view()}
const center={x:900,y:770}, coords={};
DATA.systems.forEach((s,i)=>{const a=-Math.PI/2+i*Math.PI/6;coords[s.id]={x:center.x+650*Math.cos(a),y:center.y+540*Math.sin(a)}});
const defs=svg.querySelector('defs');const marker=E('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(E('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#487d91'}));defs.append(marker);
relation.append(E('rect',{width:1800,height:1500,fill:'#f4f7fc'}));relation.append(E('text',{x:65,y:68,'font-size':32,fill:'#233b60','font-weight':700},'系统关系图 · 数据与玩法怎样流转'));
relation.append(E('text',{x:65,y:108,'font-size':18,fill:'#73859d'},'点击任一系统查看相邻联系；箭头由提供方指向接收方。存档为横贯系统的支撑能力。'));
const edgeLayer=E('g'),labelLayer=E('g'),nodeLayer=E('g');relation.append(edgeLayer,labelLayer,nodeLayer);
const edgeEls=[];
DATA.relations.forEach((r,i)=>{
 const p=coords[r.source],q=coords[r.target],dx=q.x-p.x,dy=q.y-p.y,length=Math.hypot(dx,dy), ux=dx/length,uy=dy/length;
 const margin=(v)=>Math.min(Math.abs(132/v.x)||Infinity,Math.abs(42/v.y)||Infinity);
 const start=margin({x:ux,y:uy}),end=margin({x:ux,y:uy});
 const a={x:p.x+ux*start,y:p.y+uy*start}, b={x:q.x-ux*end,y:q.y-uy*end};
 const bend=DATA.relations.some(t=>t.source===r.target&&t.target===r.source)?55:20;
 const cx=(a.x+b.x)/2-uy*bend,cy=(a.y+b.y)/2+ux*bend;
 const path=E('path',{class:'edge',d:`M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`,'marker-end':'url(#arrow)'});
 const title=E('title',{},r.label+'：'+r.detail);path.append(title);edgeLayer.append(path);
 const label=E('text',{x:.25*a.x+.5*cx+.25*b.x,y:.25*a.y+.5*cy+.25*b.y-7,class:'edge-label','text-anchor':'middle',display:'none'},r.label);labelLayer.append(label);edgeEls.push({path,label,rel:r});
});
DATA.systems.forEach((s,i)=>{const p=coords[s.id],g=E('g',{'data-id':s.id,class:'relation-node',tabindex:0,role:'button','aria-label':s.name});g.append(E('rect',{x:p.x-132,y:p.y-42,width:264,height:84,rx:15,fill:'white',stroke:s.color,'stroke-width':2}));g.append(E('text',{x:p.x,y:p.y-4,'text-anchor':'middle','font-size':23,'font-weight':700,fill:s.color},`${i+1}. ${s.name}`));g.append(E('text',{x:p.x,y:p.y+25,'text-anchor':'middle','font-size':13,fill:'#73859d'},s.unity));nodeLayer.append(g)});
const central=E('g');central.append(E('rect',{x:705,y:690,width:390,height:160,rx:18,fill:'#193151'}));central.append(E('text',{x:900,y:738,'text-anchor':'middle','font-size':28,fill:'white','font-weight':700},'三层核心循环'));central.append(E('text',{x:900,y:778,'text-anchor':'middle','font-size':19,fill:'#c3d5ef'},'城镇成长 → 探索 ⇄ 战斗'));central.append(E('text',{x:900,y:815,'text-anchor':'middle','font-size':17,fill:'#80d6ca'},'点选系统，高亮输入与输出'));relation.insertBefore(central,nodeLayer);

function addSources(list){list.forEach(s=>{const box=h('div',undefined,'source');const a=h('a',s.path.split('/').pop()+':'+s.line);a.href='../../'+s.path+'#L'+s.line;a.target='_blank';box.append(a,h('div',s.symbol));panel.append(box)})}
function section(title,body,cls){panel.append(h('h2',title),h('div',body,cls||'tiny'))}
function jump(id,label){const b=h('button',label,'jump');b.onclick=()=>select(id,true);panel.append(b)}
function showRelations(sid){const list=DATA.relations.filter(r=>r.source===sid||r.target===sid);panel.append(h('h2','系统输入与输出 · '+list.length+'条'));list.forEach(r=>{const out=r.source===sid,other=out?r.target:r.source;jump(other,(out?'输出 → ':'输入 ← ')+ids.get(other).name+'\n'+r.label);panel.append(h('p',r.detail,'tiny'))})}
function select(id,focus=false){
 const n=ids.get(id);if(!n)return;selected=id;selectedSystem=owner.get(id).id;panel.replaceChildren();
 const sys=owner.get(id),isSystem=!!n.features;
 panel.append(h('span',isSystem?'系统 / '+String(DATA.systems.indexOf(sys)+1).padStart(2,'0'):'功能 / '+sys.name,'badge'),h('h1',n.name),h('p',isSystem?n.role:n.brief));
 if(isSystem){section('Unity支撑',n.unity,'unity');panel.append(h('h2','包含的功能'));n.features.forEach(f=>jump(f.id,f.name+'\n'+f.brief))}
 else{panel.append(h('h2','如何实现'),h('p',n.how));section('使用的Unity功能 / API',n.unity,'unity');panel.append(h('h2','源码证据'));addSources(n.sources);jump(sys.id,'← 返回所属系统：'+sys.name)}
 guideLinks(n);showRelations(sys.id);panel.append(h('p','点击带下划线的Unity技术或上方技术按钮，查看介绍、用法和项目体现。源码行号对应生成本图时版本。','tiny'));
 svg.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===id));
 edgeEls.forEach(e=>{const active=e.rel.source===selectedSystem||e.rel.target===selectedSystem;e.path.classList.toggle('chosen',active);e.path.style.opacity=active?'.9':'.07';e.label.setAttribute('display',active?'block':'none')});
 if(focus&&mode==='mind'){const p=DATA.positions[sys.id];vb=[p.x-75,p.y-85,p.w+150,425];view()}
 if(focus&&window.innerWidth<850)panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function intro(){panel.replaceChildren();panel.append(h('span','当前源码 · 2026-11-03','badge'),h('h1','从功能看到实现'),h('p','彩色分支代表系统，浅色节点代表功能。每项功能都标注了实现方式、Unity API和对应脚本。'));
 section('怎样查看','点击功能看实现；点击系统看输入与输出。切到“系统关系图”可追踪跨系统联系。搜索支持中文功能名、Unity API或脚本名。');
 panel.append(h('h2','点击Unity功能查看介绍'));DATA.unityGuides.forEach(g=>panel.append(guideButton(g)));
 section('项目自定义逻辑','地图算法、BFS寻路、格子视线、卡牌规则、伤害公式、交易与结算由C#实现。图中使用“C#”与Unity引擎能力作区分。','unity');
 panel.append(h('h2','建议从这里看'));jump('battle','卡牌战斗：属性如何变成伤害');jump('items','物品：掉落、换装与快捷栏');jump('save','存档：暂停本局与正式结算的区别');
 section('核查范围',DATA.scope);panel.append(h('p','本图不是实时编辑器状态截图；本次没有操作Unity编辑器或重跑Unity测试。','tiny'))}
function boundaries(){panel.replaceChildren();panel.append(h('span','适用范围与实现边界','badge'),h('h1','如何理解这张图'));DATA.boundaries.forEach(t=>panel.append(h('p',t)));section('可编辑与分享','同目录包含PNG、SVG、Markdown、JSON以及FreeMind .mm源文件。用支持FreeMind导入的软件可继续编辑导图。');}
function setMode(m){mode=m;mind.style.display=m==='mind'?'':'none';relation.style.display=m==='relations'?'':'none';document.querySelector('#mindBtn').classList.toggle('active',m==='mind');document.querySelector('#relBtn').classList.toggle('active',m==='relations');fit()}
document.querySelector('#mindBtn').onclick=()=>setMode('mind');document.querySelector('#relBtn').onclick=()=>setMode('relations');document.querySelector('#zoomIn').onclick=()=>zoom(.8);document.querySelector('#zoomOut').onclick=()=>zoom(1.25);document.querySelector('#fitBtn').onclick=fit;document.querySelector('#boundsBtn').onclick=boundaries;
stage.addEventListener('wheel',e=>{if(e.target.closest('#searchResults'))return;e.preventDefault();zoom(e.deltaY<0?.88:1.14,{x:e.clientX,y:e.clientY})},{passive:false});
let down=null,moved=false;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;down={x:e.clientX,y:e.clientY,v:[...vb]};moved=false;svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>5)moved=true;if(!moved)return;const a=new DOMPoint(down.x,down.y).matrixTransform(svg.getScreenCTM().inverse()),b=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());vb=[down.v[0]+a.x-b.x,down.v[1]+a.y-b.y,down.v[2],down.v[3]];view()});
svg.addEventListener('pointerup',e=>{if(!down)return;down=null;if(moved)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');if(t)select(t.dataset.id)});svg.addEventListener('pointercancel',()=>{down=null});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest('[data-id]');if(t){e.preventDefault();select(t.dataset.id)}}});
const results=document.querySelector('#searchResults');
document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();results.replaceChildren();svg.querySelectorAll('.hit').forEach(el=>el.classList.remove('hit'));if(!q){results.style.display='none';return}
 const found=[...ids.values()].filter(n=>JSON.stringify(n).toLowerCase().includes(q));results.style.display='block';results.append(h('span',found.length?'找到 '+found.length+' 个节点 · 点击定位与查看详情':'没有匹配节点。可搜索“火把”“ScriptableObject”“JsonUtility”等。'));
